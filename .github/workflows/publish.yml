name: Publish extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-vscode-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx --yes @vscode/vsce publish --oidc
